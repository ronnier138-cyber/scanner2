<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>promeos Scanner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    background: #0a0a0a;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px 40px;
  }

  .header {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .logo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #888;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3a3a3a;
    transition: background 0.3s;
  }
  .status-dot.ready { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .status-dot.sending { background: #f59e0b; box-shadow: 0 0 6px #f59e0b88; animation: pulse 1s infinite; }
  .status-dot.done { background: #22c55e; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card {
    width: 100%;
    max-width: 420px;
    background: #141414;
    border: 0.5px solid #2a2a2a;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #555;
    padding: 16px 20px 10px;
  }
  .section-label .req { color: #ff8b8b; margin-left: 2px; }

  /* Sender */
  .field-area { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }

  input[type="text"] {
    width: 100%;
    height: 46px;
    background: #0d0d0d;
    border: 0.5px solid #2a2a2a;
    border-radius: 12px;
    color: #e0e0e0;
    font-size: 15px;
    font-family: inherit;
    padding: 0 16px;
    outline: none;
    -webkit-appearance: none;
  }
  input[type="text"]::placeholder { color: #444; }
  input[type="text"]:focus { border-color: #3a3a3a; }
  input[type="text"].invalid { border-color: #ef444488; }

  .remember-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #888;
    cursor: pointer;
    user-select: none;
  }
  .remember-row input { width: 18px; height: 18px; accent-color: #3b3bff; }

  /* Priority */
  .priority-group { display: flex; gap: 8px; padding: 0 16px 16px; }
  .prio-btn {
    flex: 1;
    height: 46px;
    border-radius: 12px;
    border: 0.5px solid #2a2a2a;
    background: #1e1e1e;
    color: #aaa;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-appearance: none;
  }
  .prio-btn:active { transform: scale(0.97); }
  .prio-btn.selected.high { background: #2e1a1a; border-color: #ef4444; color: #ff8b8b; }
  .prio-btn.selected.medium { background: #2e261a; border-color: #f59e0b; color: #fbbf24; }
  .prio-btn.selected.low { background: #1a2e1a; border-color: #22c55e; color: #8bff8b; }

  .photo-area {
    margin: 0 16px 16px;
    border-radius: 14px;
    overflow: hidden;
    background: #0d0d0d;
    border: 0.5px solid #2a2a2a;
    position: relative;
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  #video { width: 100%; height: 100%; object-fit: cover; display: none; }
  #photo-preview { width: 100%; height: 100%; object-fit: cover; display: none; }

  .photo-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: #444;
  }
  .photo-placeholder svg { width: 36px; height: 36px; stroke: #444; }
  .photo-placeholder span { font-size: 13px; color: #555; }

  .corner-guide {
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: #ffffff44;
    border-style: solid;
    border-width: 0;
  }
  .corner-guide.tl { top: 10px; left: 10px; border-top-width: 2px; border-left-width: 2px; border-radius: 3px 0 0 0; }
  .corner-guide.tr { top: 10px; right: 10px; border-top-width: 2px; border-right-width: 2px; border-radius: 0 3px 0 0; }
  .corner-guide.bl { bottom: 10px; left: 10px; border-bottom-width: 2px; border-left-width: 2px; border-radius: 0 0 0 3px; }
  .corner-guide.br { bottom: 10px; right: 10px; border-bottom-width: 2px; border-right-width: 2px; border-radius: 0 0 3px 0; }

  .photo-actions { display: flex; gap: 8px; padding: 0 16px 16px; }

  .btn {
    flex: 1;
    height: 46px;
    border-radius: 12px;
    border: 0.5px solid #2a2a2a;
    background: #1e1e1e;
    color: #e0e0e0;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s;
    -webkit-appearance: none;
  }
  .btn:active { transform: scale(0.97); background: #262626; }
  .btn.primary { background: #1a1a2e; border-color: #3b3bff44; color: #8b8bff; }
  .btn.primary:active { background: #22224a; }
  .btn.danger { background: #2e1a1a; border-color: #ff3b3b44; color: #ff8b8b; }
  .btn.success { background: #1a2e1a; border-color: #3bff3b44; color: #8bff8b; }
  .btn.capture { background: #1e1e1e; border-color: #ffffff22; color: #fff; font-size: 15px; flex: 2; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .audio-area {
    margin: 0 16px 16px;
    border-radius: 14px;
    background: #0d0d0d;
    border: 0.5px solid #2a2a2a;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .waveform { height: 48px; display: flex; align-items: center; justify-content: center; gap: 3px; }

  .wave-bar {
    width: 3px;
    background: #333;
    border-radius: 2px;
    height: 8px;
    transition: height 0.1s, background 0.3s;
  }
  .wave-bar.active { background: #8b8bff; animation: wave 0.6s ease-in-out infinite; }

  @keyframes wave { 0%,100% { height: 8px; } 50% { height: 32px; } }

  .wave-bar.active:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar.active:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar.active:nth-child(4) { animation-delay: 0.15s; }
  .wave-bar.active:nth-child(5) { animation-delay: 0.05s; }
  .wave-bar.active:nth-child(6) { animation-delay: 0.25s; }
  .wave-bar.active:nth-child(7) { animation-delay: 0.1s; }
  .wave-bar.active:nth-child(8) { animation-delay: 0.2s; }
  .wave-bar.active:nth-child(9) { animation-delay: 0.08s; }

  .audio-timer {
    text-align: center;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.05em;
    color: #444;
    font-variant-numeric: tabular-nums;
  }
  .audio-timer.recording { color: #e0e0e0; }
  .audio-timer.done { color: #22c55e; }

  .audio-actions { display: flex; gap: 8px; padding: 0 16px 16px; }

  .note-area { padding: 0 16px 16px; }

  textarea {
    width: 100%;
    background: #0d0d0d;
    border: 0.5px solid #2a2a2a;
    border-radius: 14px;
    color: #e0e0e0;
    font-size: 14px;
    font-family: inherit;
    padding: 14px 16px;
    resize: none;
    height: 80px;
    outline: none;
    line-height: 1.6;
  }
  textarea::placeholder { color: #444; }
  textarea:focus { border-color: #3a3a3a; }

  .send-card { width: 100%; max-width: 420px; margin-top: 4px; }

  .send-hint {
    text-align: center;
    font-size: 12px;
    color: #555;
    margin-top: 10px;
    min-height: 16px;
  }

  .send-btn {
    width: 100%;
    height: 56px;
    border-radius: 16px;
    border: none;
    background: #3b3bff;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s;
    letter-spacing: 0.01em;
  }
  .send-btn:active { transform: scale(0.98); background: #2a2aee; }
  .send-btn:disabled { background: #1e1e4a; color: #555; cursor: not-allowed; transform: none; }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1e1e1e;
    border: 0.5px solid #2a2a2a;
    border-radius: 14px;
    padding: 14px 24px;
    font-size: 14px;
    font-weight: 500;
    color: #e0e0e0;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: #22c55e44; color: #22c55e; }
  .toast.error { border-color: #ef444444; color: #ef4444; }

  canvas { display: none; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 6px;
    background: #1a2e1a;
    color: #22c55e;
    border: 0.5px solid #22c55e33;
  }
</style>
</head>
<body>

<div class="header">
  <span class="logo">promeos Scanner</span>
  <div class="status-dot" id="status-dot"></div>
</div>

<!-- Sender -->
<div class="card">
  <div class="section-label">Sender<span class="req">*</span></div>
  <div class="field-area">
    <input type="text" id="sender" list="sender-list" placeholder="Who is scanning? (your name)" autocomplete="off" oninput="onSenderInput()">
    <datalist id="sender-list"></datalist>
    <label class="remember-row">
      <input type="checkbox" id="remember-sender" checked onchange="onRememberChange()">
      Remember me on this device
    </label>
  </div>
</div>

<!-- Priority -->
<div class="card">
  <div class="section-label">Priority<span class="req">*</span></div>
  <div class="priority-group" id="priority-group">
    <button class="prio-btn high" data-value="high" onclick="setPriority('high')">High</button>
    <button class="prio-btn medium" data-value="medium" onclick="setPriority('medium')">Medium</button>
    <button class="prio-btn low" data-value="low" onclick="setPriority('low')">Low</button>
  </div>
</div>

<div class="card">
  <div class="section-label">Business Card</div>
  <div class="photo-area" id="photo-area" onclick="handlePhotoAreaClick()">
    <video id="video" autoplay playsinline muted></video>
    <img id="photo-preview" alt="Business card">
    <div class="photo-placeholder" id="photo-placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="7" width="18" height="14" rx="2"/>
        <circle cx="12" cy="14" r="3"/>
        <path d="M9 7V5a3 3 0 016 0v2"/>
      </svg>
      <span>Tap to open camera</span>
    </div>
    <div class="corner-guide tl"></div>
    <div class="corner-guide tr"></div>
    <div class="corner-guide bl"></div>
    <div class="corner-guide br"></div>
  </div>
  <div class="photo-actions" id="photo-actions">
    <button class="btn primary" id="btn-open-cam" onclick="openCamera()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Open camera
    </button>
  </div>
</div>

<div class="card">
  <div class="section-label">Voice Note</div>
  <div class="audio-area">
    <div class="waveform" id="waveform">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="audio-timer" id="audio-timer">0:00</div>
  </div>
  <div class="audio-actions">
    <button class="btn primary" id="btn-record" onclick="toggleRecord()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9"/></svg>
      Record
    </button>
    <button class="btn" id="btn-play-audio" onclick="playAudio()" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5,3 19,12 5,21"/></svg>
      Play back
    </button>
    <button class="btn danger" id="btn-clear-audio" onclick="clearAudio()" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<div class="card">
  <div class="section-label">Note (optional)</div>
  <div class="note-area">
    <textarea id="note-text" placeholder="Follow-up context, agreements, next steps..."></textarea>
  </div>
</div>

<div class="send-card">
  <button class="send-btn" id="send-btn" onclick="sendData()" disabled>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
    Send to Pipedrive
  </button>
  <div class="send-hint" id="send-hint"></div>
</div>

<div class="toast" id="toast"></div>
<canvas id="canvas"></canvas>

<script>
const WEBHOOK_URL = 'https://heatelligence.app.n8n.cloud/webhook/49e989bc-4e14-4205-a813-55c02a5ffba6';

const LS_SENDER = 'promeos_scanner_sender';
const LS_SENDER_LIST = 'promeos_scanner_sender_list';
const LS_REMEMBER = 'promeos_scanner_remember';

let stream = null;
let mediaRecorder = null;
let audioChunks = [];
let audioBlob = null;
let photoDataUrl = null;
let isRecording = false;
let timerInterval = null;
let recordSeconds = 0;
let cameraOpen = false;
let priority = null;

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const photoPreview = document.getElementById('photo-preview');
const photoPlaceholder = document.getElementById('photo-placeholder');
const audioTimer = document.getElementById('audio-timer');
const waveform = document.getElementById('waveform');
const sendBtn = document.getElementById('send-btn');
const sendHint = document.getElementById('send-hint');
const statusDot = document.getElementById('status-dot');
const senderInput = document.getElementById('sender');
const rememberBox = document.getElementById('remember-sender');

/* ---------- localStorage helpers (safe) ---------- */
function lsGet(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
function lsSet(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }
function lsRemove(key) { try { localStorage.removeItem(key); } catch(e) {} }

function getSenderList() {
  try { return JSON.parse(lsGet(LS_SENDER_LIST)) || []; } catch(e) { return []; }
}

function renderSenderList() {
  const dl = document.getElementById('sender-list');
  dl.innerHTML = '';
  getSenderList().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    dl.appendChild(opt);
  });
}

function rememberSender(name) {
  if (!rememberBox.checked || !name) return;
  lsSet(LS_SENDER, name);
  const list = getSenderList().filter(n => n.toLowerCase() !== name.toLowerCase());
  list.unshift(name);
  lsSet(LS_SENDER_LIST, JSON.stringify(list.slice(0, 10)));
  renderSenderList();
}

function initSender() {
  const remember = lsGet(LS_REMEMBER);
  rememberBox.checked = remember !== '0';
  if (rememberBox.checked) {
    const saved = lsGet(LS_SENDER);
    if (saved) senderInput.value = saved;
  }
  renderSenderList();
}

function onSenderInput() {
  senderInput.classList.remove('invalid');
  checkSendReady();
}

function onRememberChange() {
  lsSet(LS_REMEMBER, rememberBox.checked ? '1' : '0');
  if (!rememberBox.checked) lsRemove(LS_SENDER);
  else rememberSender(senderInput.value.trim());
}

/* ---------- Priority ---------- */
function setPriority(value) {
  priority = value;
  document.querySelectorAll('.prio-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.value === value);
  });
  checkSendReady();
}

/* ---------- Validation ---------- */
function checkSendReady() {
  const hasSender = senderInput.value.trim().length > 0;
  const hasContent = !!(photoDataUrl || audioBlob);
  const ready = hasSender && !!priority && hasContent;

  sendBtn.disabled = !ready;

  const missing = [];
  if (!hasSender) missing.push('sender');
  if (!priority) missing.push('priority');
  if (!hasContent) missing.push('photo or voice note');
  sendHint.textContent = missing.length ? 'Missing: ' + missing.join(', ') : '';

  statusDot.className = ready ? 'status-dot ready' : 'status-dot';
}

/* ---------- Camera ---------- */
async function openCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    video.style.display = 'block';
    photoPlaceholder.style.display = 'none';
    photoPreview.style.display = 'none';
    cameraOpen = true;

    document.getElementById('photo-actions').innerHTML = `
      <button class="btn" onclick="closeCamera()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        Cancel
      </button>
      <button class="btn capture" onclick="capturePhoto()">
        📸 Capture
      </button>
    `;
  } catch(e) {
    showToast('Camera access denied', 'error');
  }
}

function closeCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.style.display = 'none';
  cameraOpen = false;
  if (!photoDataUrl) {
    photoPlaceholder.style.display = 'flex';
    renderOpenCamButton();
  }
}

function renderOpenCamButton() {
  document.getElementById('photo-actions').innerHTML = `
    <button class="btn primary" id="btn-open-cam" onclick="openCamera()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Open camera
    </button>`;
}

function capturePhoto() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  photoDataUrl = canvas.toDataURL('image/jpeg', 0.92);
  photoPreview.src = photoDataUrl;
  photoPreview.style.display = 'block';
  video.style.display = 'none';
  closeCamera();

  document.getElementById('photo-actions').innerHTML = `
    <button class="btn danger" onclick="retakePhoto()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
      Retake
    </button>
    <span class="badge">✓ Photo ready</span>
  `;
  checkSendReady();
}

function handlePhotoAreaClick() {
  if (!cameraOpen && !photoDataUrl) openCamera();
}

function retakePhoto() {
  photoDataUrl = null;
  photoPreview.style.display = 'none';
  photoPlaceholder.style.display = 'flex';
  renderOpenCamButton();
  checkSendReady();
}

/* ---------- Audio ---------- */
async function toggleRecord() {
  if (!isRecording) {
    try {
      const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(audioStream, { mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4' });
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
        audioStream.getTracks().forEach(t => t.stop());
        audioTimer.className = 'audio-timer done';
        document.getElementById('btn-play-audio').disabled = false;
        document.getElementById('btn-clear-audio').disabled = false;
        checkSendReady();
      };
      mediaRecorder.start();
      isRecording = true;
      recordSeconds = 0;
      timerInterval = setInterval(() => {
        recordSeconds++;
        const m = Math.floor(recordSeconds / 60);
        const s = recordSeconds % 60;
        audioTimer.textContent = `${m}:${s.toString().padStart(2,'0')}`;
      }, 1000);
      audioTimer.className = 'audio-timer recording';
      waveform.querySelectorAll('.wave-bar').forEach(b => b.classList.add('active'));
      document.getElementById('btn-record').innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        Stop
      `;
      document.getElementById('btn-record').className = 'btn danger';
    } catch(e) {
      showToast('Microphone access denied', 'error');
    }
  } else {
    mediaRecorder.stop();
    clearInterval(timerInterval);
    isRecording = false;
    waveform.querySelectorAll('.wave-bar').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-record').innerHTML = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9"/></svg>
      Record
    `;
    document.getElementById('btn-record').className = 'btn primary';
  }
}

function playAudio() {
  if (!audioBlob) return;
  const url = URL.createObjectURL(audioBlob);
  const a = new Audio(url);
  a.onended = () => URL.revokeObjectURL(url);
  a.play();
}

function clearAudio() {
  audioBlob = null;
  audioChunks = [];
  recordSeconds = 0;
  audioTimer.textContent = '0:00';
  audioTimer.className = 'audio-timer';
  document.getElementById('btn-play-audio').disabled = true;
  document.getElementById('btn-clear-audio').disabled = true;
  checkSendReady();
}

/* ---------- Send ---------- */
const SEND_BTN_HTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg> Send to Pipedrive';

async function sendData() {
  const sender = senderInput.value.trim();
  if (!sender) { senderInput.classList.add('invalid'); senderInput.focus(); return; }
  if (!priority) { showToast('Select priority', 'error'); return; }
  if (!photoDataUrl && !audioBlob) return;

  rememberSender(sender);

  sendBtn.disabled = true;
  sendBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" opacity=".3"/><path d="M12 3a9 9 0 019 9"/></svg> Sending...';
  statusDot.className = 'status-dot sending';

  try {
    const payload = {
      timestamp: new Date().toISOString(),
      sender: sender,
      priority: priority,
      note: document.getElementById('note-text').value || ''
    };

    if (photoDataUrl) payload.image = photoDataUrl.split(',')[1];

    if (audioBlob) {
      const audioB64 = await blobToBase64(audioBlob);
      payload.audio = audioB64.split(',')[1];
      payload.audio_mime = audioBlob.type;
    }

    const resp = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (resp.ok) {
      showToast('✓ Sent to Pipedrive', 'success');
      statusDot.className = 'status-dot done';
      setTimeout(() => resetAll(), 2000);
    } else {
      throw new Error('HTTP ' + resp.status);
    }
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
    sendBtn.innerHTML = SEND_BTN_HTML;
    checkSendReady();
  }
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function resetAll() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  cameraOpen = false;
  video.style.display = 'none';

  photoDataUrl = null;
  audioBlob = null;
  audioChunks = [];
  recordSeconds = 0;
  photoPreview.style.display = 'none';
  photoPlaceholder.style.display = 'flex';
  audioTimer.textContent = '0:00';
  audioTimer.className = 'audio-timer';
  document.getElementById('note-text').value = '';
  document.getElementById('btn-play-audio').disabled = true;
  document.getElementById('btn-clear-audio').disabled = true;
  renderOpenCamButton();

  // Priority resets per contact; sender stays if remembered
  priority = null;
  document.querySelectorAll('.prio-btn').forEach(b => b.classList.remove('selected'));
  if (!rememberBox.checked) senderInput.value = '';

  sendBtn.innerHTML = SEND_BTN_HTML;
  checkSendReady();
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

initSender();
checkSendReady();
</script>
